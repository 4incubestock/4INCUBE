<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>4INCUBE 재고관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* ============================================================
   설정 — Apps Script 배포 후 받은 "웹 앱 URL" 을 아래 따옴표 안에 붙여넣으세요.
   비워 두면 데모 모드(브라우저 안에서만 동작, 저장 안 됨)로 열립니다.
   ============================================================ */
var API_URL = "https://script.google.com/macros/s/AKfycbx2QtdF6QjNr67MQJTJaij-W2Q3E4ZHn9d49kHBmyr2NKZghWkJnoG04LANy9ejqR5-DQ/exec";
</script>
<style>
:root{--bg:#f4f2ee;--surface:#fff;--surface2:#faf8f4;--line:#e6e0d6;--line2:#d9d3c8;--ink:#1b1a18;--ink2:#3f3b35;--muted:#8a8378;--accent:#E9641C;--accent2:#f5b58e;--navy:#2B3646;--ok:#3a8f5c;--warn:#d9a31a;--bad:#d93a3a;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.hidden{display:none!important}
/* ---- login ---- */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#fbf9f5 0%,#ebe6de 60%,#ddd6cb 100%)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px 30px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(27,26,24,.08)}
.wm{font-size:13px;letter-spacing:.34em;font-weight:700}
.wm small{display:block;font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:500;margin-top:4px}
.card h1{font-size:22px;font-weight:700;margin:22px 0 6px}
.card p.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;height:44px;border:1px solid var(--line2);border-radius:10px;padding:0 14px;background:#fff;outline:none;transition:border .15s}
.field textarea{height:auto;padding:10px 14px;min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:10px;font-weight:600;background:var(--ink);color:#fff;transition:.15s;white-space:nowrap}
.btn:hover{background:#000}.btn.w{width:100%}.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}.btn.ghost:hover{background:var(--surface2)}
.btn.accent{background:var(--accent)}.btn.accent:hover{background:#d0561a}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #f1c3c3}.btn.danger:hover{background:#fff4f4}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin:2px 0 14px;cursor:pointer}.remember span{color:var(--muted);font-size:12px}.remember input{width:16px;height:16px;accent-color:var(--accent)}
.demo-note{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line2);padding-top:12px}
/* ---- app shell ---- */
#app{min-height:100dvh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;padding:0 20px;height:58px;display:flex;align-items:center;gap:16px}
.topin .wm{font-size:12px}
nav.tabs{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button.on{color:var(--ink);background:var(--bg);font-weight:700}
.spacer{flex:1}
.who{font-size:12px;color:var(--muted);white-space:nowrap}
.who b{color:var(--ink)}
.demo-badge{font-size:11px;letter-spacing:.12em;font-weight:700;color:#fff;background:var(--accent);padding:4px 9px;border-radius:999px}
main{max-width:1240px;width:100%;margin:0 auto;padding:22px 20px 80px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.sec-h h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sec-h .eyebrow{font-size:11px;letter-spacing:.24em;color:var(--muted);font-weight:700;margin-bottom:4px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input,.tools select{height:36px;border:1px solid var(--line2);border-radius:8px;padding:0 12px;background:#fff;outline:none}
.tools input:focus,.tools select:focus{border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:0 var(--pad,12px);height:36px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
/* ---- kpi ---- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.04em}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.warn .v{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.panel h3 span{font-size:12px;color:var(--muted);font-weight:500}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:64px 1fr 40px;align-items:center;gap:10px;font-size:12.5px}
.bar .n{color:var(--ink2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t{height:16px;background:var(--surface2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar .t i{display:block;height:100%;background:var(--navy);border-radius:4px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar.zero .n{color:var(--muted)}
.cbars .bar{grid-template-columns:82px 1fr 40px}
.cbars .t i{background:var(--c)}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.12);vertical-align:-1px;margin-right:6px;background:var(--c)}
.lowlist{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip.zero{border-color:#f1c3c3;color:var(--bad);background:#fff7f7}
.chip.low{border-color:#f0d9a3;background:#fffaf0}
.chip b{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
/* ---- matrix ---- */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.mx{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;font-size:13px}
table.mx th,table.mx td{padding:0;border-bottom:1px solid var(--line);text-align:center}
table.mx th{background:var(--surface2);font-weight:600;font-size:12px;color:var(--ink2);height:44px;position:sticky;top:0;z-index:2}
table.mx th:first-child,table.mx td:first-child{position:sticky;left:0;background:#fff;z-index:3;text-align:left;padding:0 12px;min-width:170px;border-right:1px solid var(--line)}
table.mx th:first-child{z-index:4;background:var(--surface2)}
table.mx td:first-child .pn{font-weight:700}
table.mx td:first-child .ps{font-size:11px;color:var(--muted);display:block;line-height:1.3}
table.mx td.q{height:44px;min-width:78px}
table.mx td.q button{width:100%;height:100%;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;transition:.12s}
table.mx td.q button:hover{background:#fdf1e9}
table.mx td.q.z button{color:#c9c3b8;font-weight:400}
table.mx td.q.l button{color:var(--bad)}
table.mx td.sum{font-weight:700;background:var(--surface2);min-width:60px}
table.mx tr.total td{background:var(--surface2);font-weight:700;border-top:2px solid var(--line2)}
table.mx.pm{min-width:900px}table.mx.pm td.q{height:50px;min-width:74px}table.mx.pm td.q button{font-size:14px;line-height:1.1;padding:4px 0}
table.mx.pm td.q button small{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:2px;letter-spacing:.02em}
table.mx.pm td:first-child{min-width:150px}table.mx.pm td:first-child .ps{font-size:11px}
table.mx.pm tr.grp td{background:var(--surface2);font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700;height:28px;text-align:left;padding-left:12px}
.pmhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pmhead h3{margin:0;gap:8px;justify-content:flex-start}.legend{font-size:11.5px;color:var(--muted)}.legend b{color:var(--ink2);font-weight:600}
.bomlist{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13px}.bomlist .h{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700;grid-column:1/-1;margin-top:8px}
.bomlist .q{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}.bomlist .s{color:var(--muted);font-size:12px}
.pc .t .bomb,.mx .bomb{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}.pc .t .bomb:hover,.mx .bomb:hover{border-color:var(--ink);color:var(--ink)}
/* ---- cards ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pc{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pc .im{aspect-ratio:3/2;background:#f7f4ee;overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover;display:block}
.pc .b{padding:12px 14px 14px}
.pc .t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pc .t b{font-size:15px}.pc .t span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pc .nm{font-size:12px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .cs{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.pc .cs button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:3px 8px 3px 6px;font-size:12px;background:#fff;font-variant-numeric:tabular-nums}
.pc .cs button:hover{border-color:var(--ink)}
.pc .cs button.z{color:#b8b1a5}.pc .cs button.z .sw{opacity:.35}
/* ---- generic table ---- */
table.t{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.t th,table.t td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{background:var(--surface2);font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr:hover td{background:#fcfaf6}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.tag.in{background:#eef8f1;border-color:#cfe8d8;color:var(--ok)}.tag.out{background:#fff2f2;border-color:#f1c3c3;color:var(--bad)}.tag.adj{background:#fff8e8;border-color:#f0d9a3;color:#9a6f05}
.tag.admin{background:#e9edf5;border-color:#c9d2e3;color:var(--navy)}
/* ---- modal ---- */
.ov{position:fixed;inset:0;background:rgba(27,26,24,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:#fff;border-radius:18px;width:100%;max-width:440px;padding:24px;max-height:92dvh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.md h3{font-size:17px;font-weight:700;margin-bottom:4px}
.md .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.md .row{display:flex;gap:8px}
.md .row .field{flex:1}
.md .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.qtybox{display:flex;align-items:center;gap:8px}
.qtybox button{width:44px;height:44px;border:1px solid var(--line2);border-radius:10px;font-size:20px;background:#fff}
.qtybox input{text-align:center;font-size:18px;font-weight:700}
.cur{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.cur b{font-size:22px;font-variant-numeric:tabular-nums}
.cur .im{width:64px;height:44px;border-radius:8px;overflow:hidden;background:#f0ece4;flex:none}
.cur .im img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
.loading{position:fixed;top:58px;left:0;right:0;height:2px;background:var(--accent);z-index:30;animation:ld 1s linear infinite;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%}
@keyframes ld{from{background-position:-40% 0}to{background-position:140% 0}}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.topin{padding:0 14px;gap:10px}.who{display:none}main{padding:16px 14px 80px}}
@media (max-width:520px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:22px}.cards{grid-template-columns:1fr 1fr}.pc .cs button{font-size:11px}}
.cost{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}.cost b{color:var(--ink2)}
.mg{font-weight:700}.mg.good{color:var(--ok)}.mg.bad{color:var(--bad)}
.setform{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end}.setform .field{margin:0}
.inl{display:inline-flex;gap:6px;align-items:center}.inl input{width:118px;padding:6px 8px;font-size:13px;text-align:right}
tr.nocost td{background:#fff8e8}
table.t .pn{font-weight:700;display:block}table.t .ps{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}table.t .bomb{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap;background:#fff;cursor:pointer}
table.t tr.total td{background:var(--surface2);font-weight:700;border-top:2px solid var(--line2)}
.pmhead input{height:34px;border:1px solid var(--line2);border-radius:8px;padding:0 12px;background:#fff;outline:none}
@media (max-width:700px){.setform{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <form class="card" id="loginForm" autocomplete="on">
    <div class="wm">4INCUBE<small>STOCK · 재고관리</small></div>
    <h1>로그인</h1>
    <p class="sub">지급받은 아이디와 비밀번호를 입력하세요.</p>
    <div class="field"><label>아이디</label><input id="lid" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label>비밀번호</label><input id="lpw" name="password" type="password" autocomplete="current-password" required></div>
    <label class="remember"><input type="checkbox" id="lremember" checked> 로그인 상태 유지 <span>(이 기기에서 30일)</span></label>
    <button class="btn w" type="submit" id="loginBtn">로그인</button>
    <div class="err" id="lerr"></div>
    <div class="demo-note hidden" id="demoNote">데모 모드입니다. API_URL이 비어 있어 브라우저 안에서만 동작하고 저장되지 않습니다.<br>테스트 계정: <b>admin / planfurni1!</b></div>
  </form>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <header class="top"><div class="topin">
    <div class="wm">4INCUBE</div>
    <nav class="tabs" id="tabs">
      <button data-tab="dash" class="on">대시보드</button>
      <button data-tab="fg">완제품</button>
      <button data-tab="parts">부품</button>
      <button data-tab="log">입출고 이력</button>
      <button data-tab="cost" id="tabCost" class="hidden">원가 · 설정</button>
      <button data-tab="users" id="tabUsers" class="hidden">사용자</button>
      <button data-tab="me">내 계정</button>
    </nav>
    <div class="spacer"></div>
    <span class="demo-badge hidden" id="demoBadge">DEMO</span>
    <span class="who" id="who"></span>
    <button class="btn ghost sm" id="refreshBtn" title="새로고침">↻</button>
  </div></header>
  <div class="loading hidden" id="loading"></div>
  <main id="main"></main>
</div>

<script>
/* ============================ 상수 ============================ */
var COLOR_HEX = {"화이트":"#F1F0EB","블랙":"#131416","오렌지":"#EE6A22","노랑":"#EFB21A","스틸블루":"#0D3358","올리브그린":"#545D3C","분홍":"#EFA8BA","베이지":"#BDA279"};
var LOW = 1; // 이 수량 이하면 "부족"
var COLOR_CODE = {"화이트":"WH","블랙":"BK","오렌지":"OR","노랑":"YE","스틸블루":"SB","올리브그린":"OG","분홍":"PK","베이지":"BG"};
/* 기본 BOM (서버의 BOM 시트가 없거나 데모 모드일 때 사용). 실제 운영값은 구글 시트 "BOM" 탭에서 관리 */
var PART_DEF = [ // 부품코드, 부품명, 규격, 색상구분(Y=제품 색상을 따름 / N=크롬·유리·조명 공통), 분류(도어/패널/악세사리)

function $(s,el){ return (el||document).querySelector(s); }
function $$(s,el){ return Array.prototype.slice.call((el||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); }
function fmt(n){ return (Number(n)||0).toLocaleString("ko-KR"); }
function won(n){ return "₩"+fmt(n); }
function dt(iso){ var d=new Date(iso); if(isNaN(d)) return esc(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
var toastT; function toast(msg,bad){ var t=$(".toast"); if(t) t.remove(); t=document.createElement("div"); t.className="toast"+(bad?" bad":""); t.textContent=msg; document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(function(){t.remove()},2600); }
function loading(on){ $("#loading").classList.toggle("hidden",!on); }
function fgItems(){ return S.items.filter(function(i){return i.kind==="완제품"&&i.active}); }
function partItems(){ return S.items.filter(function(i){return i.kind!=="완제품"&&i.active}); }
function defaultParts(){ return PART_DEF.map(function(p){return {code:p[0],name:p[1],spec:p[2],colored:p[3]==="Y",cat:p[4]}}); }
function catOf(code){ code=String(code||"").toUpperCase(); return code.indexOf("DOOR")===0?"도어":code.indexOf("PANEL")>=0?"패널":"악세사리"; }
var CATS=["도어","패널","악세사리"];
function normSpec(s){ return String(s||"").toLowerCase().replace(/[×x*\s]/g,"x").replace(/\(.*?\)/g,""); }
/* 부품 품목 → BOM 부품 매칭. 코드 PT-<부품코드>[-<색상코드>] 가 우선, 아니면 품목명+규격이 같으면 매칭 */
function matchPart(item){
  var code=String(item.code||"").toUpperCase();
  for(var i=0;i<S.parts.length;i++){ var p=S.parts[i], pc="PT-"+p.code.toUpperCase();
    if(code===pc||(p.colored&&item.color&&code===pc+"-"+COLOR_CODE[item.color])) return p; }
  for(var j=0;j<S.parts.length;j++){ var q=S.parts[j]; if(item.name&&item.name.trim()===q.name&&normSpec(item.spec)===normSpec(q.spec)) return q; }
  return null;
}
/* 파츠별 재고 집계: 완제품 재고 × BOM + 부품 보유. 결과: [{part, cols:{색상:{bom,have,total,from:[{no,stock,per}],items:[]}}, common:{...}}] */
function partStock(){
  var ps=products(), cols=S.colors.slice(), uncolored=false;
  var rows=S.parts.map(function(p){ var o={part:p,cols:{},common:{bom:0,have:0,total:0,from:[],items:[]}}; cols.forEach(function(c){ o.cols[c]={bom:0,have:0,total:0,from:[],items:[]}; }); return o; });
  var byCode={}; rows.forEach(function(r){byCode[r.part.code]=r});
  ps.forEach(function(prod){ var b=S.bom[prod.no]||S.bom[String(prod.no)]; if(!b) return;
    Object.keys(b).forEach(function(code){ var r=byCode[code]; if(!r) return; var per=Number(b[code])||0; if(!per) return;
      if(r.part.colored){ cols.forEach(function(c){ var it=prod.cols[c]; var st=it?it.qty:0; if(st>0){ r.cols[c].bom+=st*per; r.cols[c].from.push({no:prod.no,name:prod.name,color:c,stock:st,per:per}); } }); }
      else { var st2=prod.total; if(st2>0){ r.common.bom+=st2*per; r.common.from.push({no:prod.no,name:prod.name,color:"",stock:st2,per:per}); } }
    });
  });
  partItems().forEach(function(it){ var p=matchPart(it); if(!p) return; var r=byCode[p.code];
    if(p.colored){ var c=it.color; if(!c||!r.cols[c]){ if(!r.cols["미지정"]){ cols.indexOf("미지정")<0&&cols.push("미지정"); rows.forEach(function(x){ if(!x.cols["미지정"]) x.cols["미지정"]={bom:0,have:0,total:0,from:[],items:[]}; }); uncolored=true; } c="미지정"; } r.cols[c].have+=it.qty; r.cols[c].items.push(it); }
    else { r.common.have+=it.qty; r.common.items.push(it); }
  });
  rows.forEach(function(r){ Object.keys(r.cols).forEach(function(c){ r.cols[c].total=r.cols[c].bom+r.cols[c].have; }); r.common.total=r.common.bom+r.common.have; });
  return {rows:rows,cols:cols,uncolored:uncolored};
}
function products(){ var m={}; fgItems().forEach(function(i){ var k=i.no; if(!m[k]) m[k]={no:i.no,name:i.name.replace(/^No\d+\s*/,""),spec:i.spec,price:i.price,wholesale:null,wholesaleAuto:false,cols:{},total:0,order:null}; m[k].cols[i.color]=i; if(i.wholesale!=null&&(m[k].wholesale==null||!i.wholesaleAuto)){ m[k].wholesale=i.wholesale; m[k].wholesaleAuto=!!i.wholesaleAuto; } m[k].total+=i.qty; if(i.order!=null&&(m[k].order==null||i.order<m[k].order)) m[k].order=i.order; });
  // 정렬: 시트 M열 "표시순서"가 있으면 그 순서(작은 수부터), 없는 제품은 뒤로 No 순
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){ var ao=a.order==null?1e9:a.order, bo=b.order==null?1e9:b.order; return ao-bo||a.no-b.no; }); }

/* ============================ 원가 (관리자) ============================
 * 수입단가(원) = CNY × 환율 × (1 + 부대비용률/100).  제품 원가 = Σ(BOM 수량 × 부품 CNY) 환산.  서버가 관리자에게만 settings/partCost 를 보내므로 직원 화면에서는 모두 null */
function isAdmin(){ return !!(S.user&&S.user.role==="admin"); }
function hasCost(){ return isAdmin()&&!!S.partCost&&!!S.settings; }
function cnyKrw(cny){ var st=S.settings||{rate:200,extraPct:0}; return Math.round((Number(cny)||0)*st.rate*(1+(st.extraPct||0)/100)); }
function partCny(code){ var v=S.partCost?S.partCost[code]:null; return v==null?0:Number(v)||0; }
function partKrw(code){ return cnyKrw(partCny(code)); }
function cnyUsd(cny){ var r=(S.settings||{}).usdCny||6.71; return (Number(cny)||0)/r; }
function fmtUsd(n){ return "$"+(Math.round((Number(n)||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtCny(n){ return "¥"+(Math.round((Number(n)||0)*10)/10).toLocaleString("ko-KR",{minimumFractionDigits:1,maximumFractionDigits:1}); }
/* 제품 1대 원가: {cny, krw, lines:[{code,qty,cny,krw}], missing:[부품코드]} */
function bomCost(no){ var b=S.bom[no]||S.bom[String(no)]||{}, out={cny:0,krw:0,lines:[],missing:[]}; if(!hasCost()) return out;
  S.parts.forEach(function(p){ var q=Number(b[p.code])||0; if(!q) return; var c=partCny(p.code); if(!c) out.missing.push(p.code); out.lines.push({code:p.code,qty:q,cny:c,krw:cnyKrw(c),sumCny:c*q,sumKrw:cnyKrw(c*q)}); out.cny+=c*q; }); out.krw=cnyKrw(out.cny); return out; }
function marginPct(price,cost){ return price&&cost?Math.round((price-cost)/price*1000)/10:null; }
function mgTag(price,cost){ var m=marginPct(price,cost); if(m==null) return "—"; return '<span class="mg '+(m>=30?"good":m<15?"bad":"")+'">'+m+'%</span>'; }
/* 부품 품목 1개의 원화 단가: 매칭되는 BOM 부품의 CNY 환산 (품목에 직접 입력한 수입단가가 있으면 그것 우선) */
function itemUnitCost(it){ if(!isAdmin()) return null; if(it.cost) return it.cost; if(it.kind==="완제품") return hasCost()?bomCost(it.no).krw||null:null; var p=matchPart(it); return p&&hasCost()?partKrw(p.code)||null:null; }

/* 대시보드: 색상별 파츠 재고 = 완제품 BOM 환산 + 부품 보유 */
function partsPanel(cat,opts){
  opts=opts||{}; var st=partStock(), mode=S.pmode, cols=st.cols;
  var rowsAll=st.rows.filter(function(r){ return !cat||cat==="전체"||r.part.cat===cat; });
  var colored=rowsAll.filter(function(r){return r.part.colored}), common=rowsAll.filter(function(r){return !r.part.colored});
  function val(x){ return mode==="bom"?x.bom:mode==="have"?x.have:x.total; }
  function cell(x,code,color){ var v=val(x); return '<td class="q'+(v===0?" z":"")+'"><button data-part="'+esc(code)+'" data-pcolor="'+esc(color)+'" title="상세">'+fmt(v)+(mode==="total"&&v?'<small>B '+fmt(x.bom)+' · P '+fmt(x.have)+'</small>':'')+'</button></td>'; }
  var groups=[], gmap={}; colored.forEach(function(r){ var g=r.part.name; if(!gmap[g]){gmap[g]=[];groups.push(g);} gmap[g].push(r); });
  var ctot={}; cols.forEach(function(c){ctot[c]=0}); var grand=0;
  var body=groups.map(function(g){ var rs=gmap[g]; return (groups.length>1?'<tr class="grp"><td colspan="'+(cols.length+2)+'">'+esc(g)+'</td></tr>':'')+rs.map(function(r){ var sum=0; var tds=cols.map(function(c){ var x=r.cols[c]; sum+=val(x); ctot[c]+=val(x); return cell(x,r.part.code,c); }).join(""); grand+=sum; return '<tr><td><span class="pn">'+esc(r.part.name)+'</span><span class="ps">'+esc(r.part.spec)+' · '+esc(r.part.code)+'</span></td>'+tds+'<td class="sum">'+fmt(sum)+'</td></tr>'; }).join(""); }).join("");
  var commonRows=common.map(function(r){ var x=r.common; return '<tr><td><span class="pn">'+esc(r.part.name)+'</span><span class="ps">'+esc(r.part.spec)+' · '+esc(r.part.code)+'</span></td><td class="q'+(x.bom?"":" z")+'"><button data-part="'+esc(r.part.code)+'" data-pcolor="">'+fmt(x.bom)+'</button></td><td class="q'+(x.have?"":" z")+'"><button data-part="'+esc(r.part.code)+'" data-pcolor="">'+fmt(x.have)+'</button></td><td class="sum">'+fmt(x.total)+'</td></tr>'; }).join("");
  var segs='<div class="seg"><button data-pmode="total" class="'+(mode==="total"?"on":"")+'">합계</button><button data-pmode="bom" class="'+(mode==="bom"?"on":"")+'">완제품 BOM 환산</button><button data-pmode="have" class="'+(mode==="have"?"on":"")+'">부품 보유</button></div>';
  var colorTable=colored.length?'<div class="tablewrap"><table class="mx pm"><thead><tr><th>부품</th>'+cols.map(function(c){return '<th>'+(COLOR_HEX[c]?'<span class="sw" style="--c:'+COLOR_HEX[c]+'"></span>':'')+esc(c)+'</th>'}).join("")+'<th>합계</th></tr></thead><tbody>'+body
  +'<tr class="total"><td>합계</td>'+cols.map(function(c){return '<td>'+fmt(ctot[c])+'</td>'}).join("")+'<td class="sum">'+fmt(grand)+'</td></tr></tbody></table></div>':'';
  var commonTable=common.length?'<h3 style="margin:'+(colored.length?'18px':'0')+' 0 10px">공통 부품 <span>크롬 프레임 · 유리 · 조명 (색상 무관)</span></h3><div class="tablewrap"><table class="mx pm" style="min-width:520px"><thead><tr><th>부품</th><th>완제품 BOM 환산</th><th>부품 보유</th><th>합계</th></tr></thead><tbody>'+commonRows+'</tbody></table></div>':'';
  return '<div class="panel" style="margin-bottom:14px"><div class="pmhead"><h3>'+(opts.title||'색상별 파츠 재고')+' <span>'+(opts.sub||'완제품을 분해했을 때 확보 가능한 부품 수량')+'</span></h3>'+segs+'</div>'
  +'<div class="legend" style="margin-bottom:10px"><b>합계</b> = 완제품 재고 × 1대당 BOM 수량 (<b>B</b>) + 부품 탭에 등록된 보유 수량 (<b>P</b>). 숫자를 누르면 어떤 제품에서 나오는지 볼 수 있습니다.</div>'
  +colorTable+commonTable
  +(opts.compact?'':'<p class="note">BOM(1대당 부품 구성)은 구글 시트 "BOM" 탭에서 수정할 수 있고, 완제품 카드의 BOM 버튼으로 제품별 구성을 확인할 수 있습니다. 완제품을 실제로 분해했을 때는 완제품 수량을 눌러 "분해 →부품", 부품으로 조립했을 때는 "조립 ←부품"을 기록하면 부품 재고와 완제품 재고가 함께 움직입니다. 수입 컨테이너로 들어온 완제품은 그냥 "입고"를 쓰세요 (부품 차감 없음).</p>')+'</div>';
}
function viewFG(){

  var head='<div class="sec-h"><div><div class="eyebrow">FINISHED GOODS</div><h2>완제품 재고</h2></div><div class="tools"><input id="fgq" placeholder="검색 (No, 이름, 크기)" value="'+esc(S.q)+'"><div class="seg"><button data-view="matrix" class="'+(S.fgView==="matrix"?"on":"")+'">표</button><button data-view="cards" class="'+(S.fgView==="cards"?"on":"")+'">카드</button></div></div></div>';

  }
  return head+'<div class="cards">'+ps.map(function(p){ return '<div class="pc"><div class="im"><img src="'+IMG(p.no)+'" alt="No'+p.no+'" loading="lazy" onerror="this.style.opacity=.15"></div><div class="b"><div class="t"><b>No'+p.no+'<button class="bomb" data-bom="'+p.no+'">BOM</button></b><span>총 '+p.total+'대'+(isAdmin()?' · '+(p.price?won(p.price):'<span style="color:var(--muted)">판매가 미정</span>'):p.wholesale?' · 도매 '+won(p.wholesale):'')+'</span></div>'+(isAdmin()?(function(){ var bc=hasCost()?bomCost(p.no):null; return '<div class="cost">도매 <b>'+(p.wholesale?won(p.wholesale):"—")+'</b>'+(bc&&bc.krw?' · 원가 <b>'+won(bc.krw)+'</b> · 마진 '+mgTag(p.price,bc.krw):'')+'</div>'; })():'')+'<div class="nm">'+esc(p.name)+' · '+esc(p.spec)+'</div><div class="cs">'+S.colors.map(function(c){ var it=p.cols[c]; var qn=it?it.qty:0; return '<button class="'+(qn===0?"z":"")+'" data-move="'+esc(it?it.code:"")+'"><span class="sw" style="--c:'+COLOR_HEX[c]+'"></span>'+esc(c)+' <b>'+qn+'</b></button>'; }).join("")+'</div></div></div>'; }).join("")+'</div>';
}
function viewParts(){
  var admin=S.user.role==="admin", cat=S.pcat, st=partStock();
  var q=S.q.trim().toLowerCase();
  var items=partItems().map(function(i){ var p=matchPart(i); return {it:i,part:p,cat:p?p.cat:"기타"}; });
  if(cat!=="전체") items=items.filter(function(x){return x.cat===cat});
  if(q) items=items.filter(function(x){var i=x.it; return (i.code+" "+i.name+" "+i.color+" "+i.spec).toLowerCase().indexOf(q)>=0});
  // 분류별 요약: BOM 환산 / 보유 / 합계
  var sum={}; CATS.forEach(function(c){sum[c]={bom:0,have:0}});
  st.rows.forEach(function(r){ var c=sum[r.part.cat]||sum["악세사리"]; if(r.part.colored) Object.keys(r.cols).forEach(function(k){ c.bom+=r.cols[k].bom; c.have+=r.cols[k].have; }); else { c.bom+=r.common.bom; c.have+=r.common.have; } });
  var kpis='<div class="kpis" style="grid-template-columns:repeat(3,1fr)">'+CATS.map(function(c){ var x=sum[c]; return '<div class="kpi" style="cursor:pointer'+(cat===c?';border-color:var(--ink)':'')+'" data-pcat="'+c+'"><div class="l">'+c+'</div><div class="v">'+fmt(x.bom+x.have)+'<small>개</small></div><div class="s">BOM 환산 '+fmt(x.bom)+' · 보유 '+fmt(x.have)+'</div></div>'; }).join("")+'</div>';
  var legacy=partItems().filter(function(i){return !matchPart(i)});
  var seg='<div class="seg">'+["전체"].concat(CATS).concat(legacy.length?["기타"]:[]).map(function(c){return '<button data-pcat="'+c+'" class="'+(cat===c?"on":"")+'">'+c+'</button>'}).join("")+'</div>';
  var legacyBar=legacy.length?'<div class="panel" style="margin-bottom:14px;border-color:#f0d9a3;background:#fff8e8"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1;font-size:13px"><b>구버전 부품 코드 '+legacy.length+'건</b> — 상·하판/뒷판/측판/스토퍼 암 등 예전 코드(예: PT-HPANEL-750x350-WH)로 등록된 품목은 현재 BOM(패널 · 사이드패널 · 힌지)과 연결되지 않아 분류 "기타"로만 보이고 파츠 집계에도 빠집니다.'+(admin?' "정리"를 누르면 상·하판·뒷판·측판은 같은 크기의 패널 코드로 합쳐지고(수량 합산), 스토퍼 암과 수량 0 인 옛 품목은 삭제됩니다.':' 관리자가 정리할 수 있습니다.')+'</div>'+(admin?'<button class="btn accent sm" id="cleanLegacyBtn">구버전 코드 정리</button>':'')+'</div></div>':'';
  return legacyBar+'<div class="sec-h"><div><div class="eyebrow">PARTS</div><h2>부품 재고</h2></div><div class="tools">'+seg+'<input id="fgq" placeholder="검색 (코드, 이름, 색상)" value="'+esc(S.q)+'">'+(admin?'<button class="btn ghost sm" id="seedBomBtn" title="BOM에 나오는 부품을 색상별로 한 번에 등록 (수량 0)">BOM 부품 일괄 등록</button><button class="btn accent sm" id="addItemBtn">+ 부품 등록</button>':'')+'</div></div>'
  +kpis
  +partsPanel(cat,{compact:true,title:(cat==="전체"?"파츠 요약":cat+" 요약"),sub:"완제품 BOM 환산 + 부품 보유"})
  +'<h3 style="font-size:14px;font-weight:700;margin:6px 0 10px">등록된 부품 품목 <span style="font-size:12px;color:var(--muted);font-weight:500">'+(cat==="전체"?"전체":cat)+' · '+items.length+'건</span></h3>'
  +'<div class="tablewrap"><table class="t"><thead><tr><th>코드</th><th>분류</th><th>품목명</th><th>색상</th><th>규격</th><th class="num">현재수량</th>'+(admin?'<th class="num">CNY 단가</th><th class="num">수입단가(원)</th><th class="num">재고원가</th>':'')+'<th></th></tr></thead><tbody>'
  +(items.length? items.map(function(x){ var i=x.it; return '<tr><td><code>'+esc(i.code)+'</code></td><td><span class="tag">'+esc(x.cat)+'</span></td><td>'+esc(i.name)+'</td><td>'+(i.color?'<span class="sw" style="--c:'+(COLOR_HEX[i.color]||"#ccc")+'"></span>'+esc(i.color):"—")+'</td><td>'+esc(i.spec||"—")+'</td><td class="num"><b>'+fmt(i.qty)+'</b> '+esc(i.unit)+'</td>'+(admin?(function(){ var uc=itemUnitCost(i), cn=x.part?partCny(x.part.code):0; return '<td class="num">'+(cn?fmtCny(cn):"—")+'</td><td class="num">'+(uc?won(uc)+(i.cost?'<small style="color:var(--muted)"> 직접입력</small>':''):"—")+'</td><td class="num">'+(uc?won(uc*i.qty):"—")+'</td>'; })():'')+'<td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-move="'+esc(i.code)+'">입출고</button>'+(admin?' <button class="btn ghost sm" data-edit="'+esc(i.code)+'">수정</button>':'')+'</td></tr>'; }).join("") : '<tr><td colspan="'+(admin?10:7)+'"><div class="empty">'+(partItems().length?'이 분류에 등록된 부품이 없습니다.':'등록된 부품이 없습니다. '+(admin?'"BOM 부품 일괄 등록"을 누르면 도어·패널·악세사리가 색상별로 한 번에 등록되고, 완제품을 분해하면 자동으로 여기에 들어옵니다.':'관리자가 부품을 등록하면 여기에 표시됩니다.'))+'</div></td></tr>')
  +'</tbody></table></div><p class="note">코드가 PT-&lt;BOM 부품코드&gt;-&lt;색상코드&gt; (예: PT-DOOR-750x350-WH, 공통 부품은 PT-BALL) 이거나 품목명·규격이 BOM과 같으면 위 요약의 보유 수량(P)에 자동으로 합산되고 분류가 붙습니다.'+(admin?' 수입단가(원)는 "원가 · 설정" 탭의 CNY 단가 × 환율로 계산되며, 입고 때 단가를 직접 입력한 품목은 그 값을 우선합니다.':'')+'</p>';
}

}

    if(type==="분해"||type==="조립"){
      var asm=type==="조립";
      api({action:asm?"assemble":"disassemble",code:code,qty:q,note:$("#mnote",ov).value}).then(function(r){
        if(!r.ok){ $("#msave",ov).disabled=false; $("#merr",ov).textContent=r.message||(type+" 실패"); return; }
        ov.remove(); toast(asm?title+" "+q+"대 조립 ← 부품 "+r.parts+"종 출고 (재고 "+r.qty+"대)":title+" "+q+"대 분해 → 부품 "+r.parts+"종 입고 (남은 재고 "+r.qty+"대)"); load();
      }); return;
    }
    api({action:"move",code:code,type:type,qty:q,cost:type==="입고"&&cost!==""?Number(cost):"",note:$("#mnote",ov).value}).then(function(r){
      if(!r.ok){ $("#msave",ov).disabled=false; $("#merr",ov).textContent=r.message||"저장 실패"; return; }
      ov.remove(); toast(title+" → "+r.qty+it.unit+" 저장됨"); load();
    });
  };
}
function openBom(no){
  var ps=products(), prod=null; ps.forEach(function(p){ if(p.no===no) prod=p; });
  var b=S.bom[no]||S.bom[String(no)]||{}, byCode={}; S.parts.forEach(function(p){byCode[p.code]=p});
  var codes=S.parts.map(function(p){return p.code}).filter(function(c){return b[c]});
  var colored=codes.filter(function(c){return byCode[c].colored}), common=codes.filter(function(c){return !byCode[c].colored});
  var bc=hasCost()?bomCost(no):null;
  function li(c){ var p=byCode[c]; var cn=bc?partCny(c):0; return '<div>'+esc(p.name)+' <span class="s">'+esc(p.spec)+'</span>'+(bc?'<br><span class="s">'+(cn?fmtCny(cn)+' × '+fmt(b[c])+' = '+fmtCny(cn*b[c])+' · '+won(cnyKrw(cn*b[c])):'<span style="color:var(--bad)">단가 미입력</span>')+'</span>':'')+'</div><div class="q">'+fmt(b[c])+'</div>'; }
  var stockLine=prod?S.colors.filter(function(c){return prod.cols[c]&&prod.cols[c].qty>0}).map(function(c){return '<span class="sw" style="--c:'+COLOR_HEX[c]+'"></span>'+esc(c)+' '+prod.cols[c].qty}).join(' &nbsp; '):'';
  modal('<h3>No'+no+' BOM <span style="font-weight:400;color:var(--muted);font-size:13px">1대당 부품 구성</span></h3><div class="sub">'+esc(prod?prod.name+' · '+prod.spec:"")+'</div>'
  +'<div class="cur"><div class="im"><img src="'+IMG(no)+'" alt="" onerror="this.style.display=\'none\'"></div><div style="font-size:12.5px">현재 재고 <b style="font-size:16px">'+(prod?prod.total:0)+'</b>대<br><span style="color:var(--muted)">'+(stockLine||"재고 없음")+'</span></div></div>'
  +'<div class="bomlist">'+(colored.length?'<div class="h">색상 부품 (제품 색상)</div>'+colored.map(li).join(""):'')+(common.length?'<div class="h">공통 부품 (크롬 · 유리 · 조명)</div>'+common.map(li).join(""):'')+(codes.length?'':'<div class="empty">BOM이 등록되지 않았습니다. 구글 시트 BOM 탭에 추가하세요.</div>')+'</div>'
  +(bc&&codes.length?'<div class="cur" style="display:block;margin:14px 0 0"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>1대 원가 <b style="font-size:16px">'+fmtCny(bc.cny)+'</b> <span style="color:var(--muted)">('+fmtUsd(cnyUsd(bc.cny))+')</span> → <b style="font-size:16px">'+won(bc.krw)+'</b> <span class="s" style="color:var(--muted)">(환율 '+fmt(S.settings.rate)+'원'+(S.settings.extraPct?' · 부대비용 +'+S.settings.extraPct+'%':'')+')</span></span></div><div style="margin-top:6px;font-size:12.5px;color:var(--ink2)">판매가 '+(prod&&prod.price?won(prod.price)+' · 마진 '+mgTag(prod.price,bc.krw):"—")+' &nbsp;|&nbsp; 도매가 '+(prod&&prod.wholesale?won(prod.wholesale)+' · 마진 '+mgTag(prod.wholesale,bc.krw):"—")+'</div>'+(bc.missing.length?'<div style="margin-top:6px;font-size:12px;color:var(--bad)">단가 미입력 부품 '+bc.missing.length+'종 — 원가 · 설정 탭에서 입력하세요</div>':'')+'</div>':'')
  +(!isAdmin()&&prod&&prod.wholesale?'<div class="cur" style="margin:14px 0 0">도매가 <b style="font-size:16px">'+won(prod.wholesale)+'</b></div>':'')
  +'<div class="foot" style="margin-top:16px"><button class="btn ghost" type="button" onclick="this.closest(\'.ov\').remove()">닫기</button></div>');
}
function openPartDetail(code,color){
  var st=partStock(), row=null; st.rows.forEach(function(r){ if(r.part.code===code) row=r; }); if(!row) return;
  var p=row.part, x=p.colored?row.cols[color]:row.common; if(!x) return;
  var title=esc(p.name)+' '+esc(p.spec)+(p.colored?' · '+esc(color):' · 공통');
  var from=x.from.slice().sort(function(a,b){return b.stock*b.per-a.stock*a.per});
  var admin=S.user.role==="admin";
  var ov=modal('<h3>'+title+'</h3><div class="sub">'+esc(p.code)+' · 합계 <b>'+fmt(x.total)+'</b>개 = BOM 환산 '+fmt(x.bom)+' + 부품 보유 '+fmt(x.have)+(hasCost()?' · 단가 '+(partCny(p.code)?fmtCny(partCny(p.code))+' = '+won(partKrw(p.code))+' · 보유분 원가 '+won(partKrw(p.code)*x.have):'<span style="color:var(--bad)">미입력</span>'):'')+'</div>'
  +'<div class="bomlist"><div class="h">완제품 BOM 환산 — '+fmt(x.bom)+'개</div>'+(from.length?from.map(function(f){ return '<div>No'+f.no+' <span class="s">'+esc(f.name)+(f.color?' · '+esc(f.color):'')+'</span><br><span class="s">재고 '+f.stock+'대 × '+f.per+'개</span></div><div class="q">'+fmt(f.stock*f.per)+'</div>'; }).join(""):'<div class="empty">이 부품이 들어가는 완제품 재고가 없습니다.</div>')
  +'<div class="h">부품 보유 — '+fmt(x.have)+'개</div>'+(x.items.length?x.items.map(function(it){ return '<div>'+esc(it.name)+' <span class="s">'+esc(it.code)+'</span></div><div class="q"><button class="btn ghost sm" data-move="'+esc(it.code)+'">'+fmt(it.qty)+' 입출고</button></div>'; }).join(""):'<div class="empty" style="grid-column:1/-1">등록된 부품 품목이 없습니다.'+(admin?' 부품 탭의 "BOM 부품 일괄 등록" 또는 "부품 등록"으로 추가하세요.':'')+'</div>')+'</div>'
  +'<div class="foot" style="margin-top:16px"><button class="btn ghost" type="button" onclick="this.closest(\'.ov\').remove()">닫기</button></div>');
  $$("[data-move]",ov).forEach(function(b){ b.onclick=function(){ ov.remove(); openMove(b.dataset.move); }; });
}
function openItem(code){
  var it=code?S.items.find(function(i){return i.code===code}):null;
  var ov=modal('<h3>'+(it?"품목 수정":"부품 등록")+'</h3><div class="sub">'+(it?"코드는 바꿀 수 없습니다. 수량은 입출고로만 바뀝니다.":"재고를 셀 최소 단위로 등록하세요. 색상이 다르면 별도 품목입니다.")+'</div>'
  +(it?'':'<div class="field"><label>BOM 부품에서 선택 (선택하면 코드·이름·규격 자동 입력)</label><select id="ipart"><option value="">— 직접 입력</option>'+S.parts.map(function(p){return '<option value="'+esc(p.code)+'">'+esc('['+p.cat+'] '+p.name+' '+p.spec)+(p.colored?'':' (공통)')+'</option>'}).join("")+'</select></div>')
  +'<div class="field"><label>코드</label><input id="icode" value="'+esc(it?it.code:"PT-")+'" '+(it?"readonly":"")+' placeholder="PT-DOOR-750x350-WH"></div>'
  +'<div class="row"><div class="field"><label>구분</label><select id="ikind"><option value="부품"'+(!it||it.kind==="부품"?" selected":"")+'>부품</option><option value="완제품"'+(it&&it.kind==="완제품"?" selected":"")+'>완제품</option></select></div><div class="field"><label>제품번호 (완제품만)</label><input id="ino" type="number" value="'+esc(it&&it.no!=null?it.no:"")+'"></div></div>'
  +'<div class="field"><label>품목명</label><input id="iname" value="'+esc(it?it.name:"")+'" placeholder="예: 도어 750 (드롭다운)"></div>'
  +'<div class="row"><div class="field"><label>색상</label><select id="icolor"><option value="">— 없음</option>'+S.colors.map(function(c){return '<option'+(it&&it.color===c?" selected":"")+'>'+esc(c)+'</option>'}).join("")+'</select></div><div class="field"><label>단위</label><input id="iunit" value="'+esc(it?it.unit:"개")+'"></div></div>'
  +'<div class="field"><label>규격</label><input id="ispec" value="'+esc(it?it.spec:"")+'" placeholder="예: 750×350"></div>'
  +'<div class="row"><div class="field"><label>수입단가 (원 · 비우면 BOM 원가)</label><input id="icost" type="number" value="'+esc(it&&it.cost!=null?it.cost:"")+'"></div><div class="field"><label>판매가 (원)</label><input id="iprice" type="number" value="'+esc(it&&it.price!=null?it.price:"")+'"></div></div>'
  +'<div class="field"><label>도매가 (원 · 완제품, 비우면 설정의 도매가율로 자동)</label><input id="iws" type="number" value="'+esc(it&&it.wholesale!=null&&!it.wholesaleAuto?it.wholesale:"")+'" placeholder="'+esc(it&&it.wholesaleAuto?"자동 "+fmt(it.wholesale):"")+'"></div>'
  +(it?'':'<div class="field"><label>초기 수량</label><input id="iqty" type="number" value="0"></div>')
  +'<div class="field"><label>비고</label><input id="imemo" value="'+esc(it?it.memo:"")+'"></div>'
  +(it?'<div class="field"><label><input type="checkbox" id="iactive" '+(it.active?"checked":"")+'> 사용 중 (해제하면 목록에서 숨김)</label></div>':'')
  +'<div class="err" id="ierr"></div><div class="foot"><button class="btn ghost" type="button" id="icancel">취소</button><button class="btn accent" type="button" id="isave">저장</button></div>');
  $("#icancel",ov).onclick=function(){ov.remove()};
  var sel=$("#ipart",ov); if(sel){ var fill=function(){ var p=S.parts.filter(function(x){return x.code===sel.value})[0]; if(!p) return; var c=$("#icolor",ov).value; if(!p.colored){ $("#icolor",ov).value=""; c=""; } $("#icode",ov).value="PT-"+p.code+(p.colored&&c?"-"+COLOR_CODE[c]:""); $("#iname",ov).value=p.name; $("#ispec",ov).value=p.spec; $("#ikind",ov).value="부품"; }; sel.onchange=fill; $("#icolor",ov).onchange=function(){ if(sel.value) fill(); }; }
  $("#isave",ov).onclick=function(){
    var d={code:$("#icode",ov).value.trim(),kind:$("#ikind",ov).value,no:$("#ino",ov).value,name:$("#iname",ov).value.trim(),color:$("#icolor",ov).value,unit:$("#iunit",ov).value||"개",spec:$("#ispec",ov).value,cost:$("#icost",ov).value,price:$("#iprice",ov).value,wholesale:$("#iws",ov).value,memo:$("#imemo",ov).value,active:it?$("#iactive",ov).checked:true};
    if(!it) d.qty=$("#iqty",ov).value;
    if(!d.code||!d.name){ $("#ierr",ov).textContent="코드와 품목명은 필수입니다"; return; }
    $("#isave",ov).disabled=true;
    api({action:"upsertItem",item:d}).then(function(r){ if(!r.ok){ $("#isave",ov).disabled=false; $("#ierr",ov).textContent=r.message||"저장 실패"; return; } ov.remove(); toast("저장했습니다"); load(); });
  };
}
function openAddUser(){
  var ov=modal('<h3>사용자 추가</h3><div class="sub">아이디와 비밀번호를 직접 지급하세요.</div><div class="field"><label>아이디 (영문·숫자 3~20자)</label><input id="uid" autocomplete="off"></div><div class="field"><label>이름</label><input id="uname"></div><div class="field"><label>비밀번호 (6자 이상)</label><input id="upw" autocomplete="new-password"></div><div class="field"><label>권한</label><select id="urole"><option value="staff">직원 — 입출고 · 조회</option><option value="admin">관리자 — 전체</option></select></div><div class="err" id="uerr"></div><div class="foot"><button class="btn ghost" type="button" id="ucancel">취소</button><button class="btn accent" type="button" id="usave">추가</button></div>');
  $("#ucancel",ov).onclick=function(){ov.remove()};
  $("#usave",ov).onclick=function(){ api({action:"addUser",id:$("#uid",ov).value.trim(),name:$("#uname",ov).value.trim(),pw:$("#upw",ov).value,role:$("#urole",ov).value}).then(function(r){ if(!r.ok){$("#uerr",ov).textContent=r.message||"실패";return;} ov.remove(); toast("추가했습니다"); loadUsers(); }); };
}
function openResetPw(id){
  var ov=modal('<h3>비밀번호 재설정</h3><div class="sub">'+esc(id)+' 계정의 새 비밀번호</div><div class="field"><label>새 비밀번호 (6자 이상)</label><input id="rpw" autocomplete="new-password"></div><div class="err" id="rerr"></div><div class="foot"><button class="btn ghost" type="button" id="rcancel">취소</button><button class="btn accent" type="button" id="rsave">변경</button></div>');
  $("#rcancel",ov).onclick=function(){ov.remove()};
  $("#rsave",ov).onclick=function(){ api({action:"resetPw",id:id,pw:$("#rpw",ov).value}).then(function(r){ if(!r.ok){$("#rerr",ov).textContent=r.message||"실패";return;} ov.remove(); toast("변경했습니다"); }); };
}
function exportCsv(){
  var byCode={}; S.items.forEach(function(i){byCode[i.code]=i});
  var adm=isAdmin();
  var lines=[["일시","담당","코드","품목","색상","유형","변경전","변경후","증감"].concat(adm?["단가","금액"]:[]).concat(["메모"])].concat(S.log.map(function(r){ var it=byCode[r.code]||{}; return [dt(r.at),r.by,r.code,it.name||"",it.color||"",r.type,r.before,r.after,r.delta].concat(adm?[r.cost,r.amount]:[]).concat([r.note||""]); }));
  var csv="﻿"+lines.map(function(l){return l.map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="4incube_stock_log_"+new Date().toISOString().slice(0,10)+".csv"; a.click();
}
